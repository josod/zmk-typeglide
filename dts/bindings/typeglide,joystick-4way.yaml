description: Typeglide 4-way analog joystick input processor

compatible: "typeglide,joystick-4way"

include: ip_zero_param.yaml

properties:
  bindings:
    type: phandle-array
    required: true
    description: Four behavior bindings in UP, DOWN, LEFT, RIGHT order

  threshold:
    type: int
    default: 5
    description: Joystick position threshold for activating a direction
