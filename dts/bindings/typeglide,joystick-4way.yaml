description: Typeglide 4-way joystick input processor

compatible: "typeglide,joystick-4way"

include: ip_zero_param.yaml

properties:
  threshold:
    type: int
    required: false
    default: 10
    description: >
      Minimum joystick magnitude required to leave the center deadzone.

  rotation-deg:
    type: int
    required: false
    default: 0
    description: >
      Global joystick rotation correction in degrees.

  hysteresis-deg:
    type: int
    required: false
    default: 10
    description: >
      Angular hysteresis around the four sector boundaries.

  bindings:
    type: phandle-array
    required: true
    description: >
      Four ZMK behavior bindings in RIGHT, LEFT, DOWN, UP order.

  layer-count:
    type: int
    required: true
