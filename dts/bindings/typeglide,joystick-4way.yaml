
description: Typeglide 4-way joystick input processor

compatible: "typeglide,joystick-4way"

include: ip_zero_param.yaml

properties:
  threshold:
    type: int
    required: false
    default: 15
    description: >
      Absolute joystick value required to leave the center deadzone.

  bindings:
    type: phandle-array
    required: true
    description: >
      Four ZMK behavior bindings in RIGHT, LEFT, DOWN, UP order.
